    .nav{background:linear-gradient(135deg,#0a1530,#1a3a7c);height:60px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(13,27,62,.5);}

    /* ── ARTICLE LIST ────────────────────── */
    .list-header{font-family:'Playfair Display',serif;font-size:1.45rem;color:#0d1b3e;font-weight:700;margin-bottom:5px;}
    .list-sub{font-size:.86rem;color:#6b7280;margin-bottom:22px;line-height:1.6;}

    /* ── BOTTOM ARTICLES ─────────────────── */

    .bottom-section h3{font-family:'Playfair Display',serif;font-size:.98rem;color:#0d1b3e;margin-bottom:12px;font-weight:700;}
    .related-art-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-bottom:20px;}
    .related-art-card{background:#fff;border-radius:10px;overflow:hidden;cursor:pointer;transition:.2s;border:1px solid #e2e6f2;}
    .related-art-card:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(13,27,62,.1);}
    .related-art-card img{width:100%;height:88px;object-fit:cover;display:block;}

    .related-art-card-body p{font-size:.76rem;font-weight:600;color:#1c1f2e;line-height:1.3;margin-top:3px;}

    /* ── SIDEBAR ─────────────────────────── */
    .sidebar{position:sticky;top:74px;}
    .sb-card{background:#fff;border-radius:12px;border:1px solid #e2e6f2;padding:16px;margin-bottom:16px;}
    .sb-card h4{font-family:'Playfair Display',serif;font-size:.92rem;color:#0d1b3e;margin-bottom:12px;padding-bottom:9px;border-bottom:2px solid #f0a500;font-weight:700;}

    .sb-art p{font-size:.78rem;color:#1c1f2e;font-weight:500;line-height:1.3;}
    .sb-art span{font-size:.68rem;color:#6b7280;}
    .sb-prod{display:flex;gap:10px;align-items:center;margin-bottom:11px;}
    .sb-prod img{width:48px;height:48px;border-radius:7px;object-fit:contain;background:#f7f8fc;flex-shrink:0;border:1px solid #e2e6f2;}
    .sb-prod .sb-prod-info p{font-size:.78rem;font-weight:600;color:#1c1f2e;line-height:1.3;margin-bottom:4px;}
    .sb-prod .sb-prod-info a{font-size:.7rem;font-weight:700;color:#fff;background:linear-gradient(135deg,#f0a500,#e08c00);padding:3px 9px;border-radius:4px;text-decoration:none;}

    /* ── SKELETON ────────────────────────── */
    .skel{background:linear-gradient(90deg,#e8eaf2 25%,#f2f4f9 50%,#e8eaf2 75%);background-size:200% 100%;animation:sk 1.4s infinite;border-radius:10px;}
    @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
    .skel-block{margin-bottom:10px;}
    .nf{text-align:center;padding:70px 20px;}
    .nf h2{font-family:'Playfair Display',serif;font-size:1.6rem;color:#0d1b3e;margin-bottom:10px;}
    .nf p{color:#6b7280;}
    .btt{position:fixed;bottom:22px;right:22px;width:40px;height:40px;background:#0d1b3e;color:#fff;border:none;border-radius:50%;font-size:1.05rem;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(13,27,62,.3);z-index:88;transition:.2s;}
    .btt.vis{display:flex;}
    .btt:hover{background:#1a3a7c;}
    @media(max-width:600px){.art-card{flex-direction:column;}.art-thumb{width:100%;height:130px;}}
  </style>

<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbxHAmzaTSeAal82t6ICiOG93qURxI2tTWu_F51uZCuFolQgcsrt6DP5uc4q7X-Bqsc7/exec';
  const ARTIKEL_ID = new URLSearchParams(location.search).get('id') || '';

  function fetchGAS(params) {
    return new Promise((resolve, reject) => {
      const cb = '_cb_' + Date.now() + '_' + Math.random().toString(36).slice(2);
      const s  = document.createElement('script');
      const t  = setTimeout(() => { reject(new Error('Timeout — cek GAS dan deployment')); cleanup(); }, 15000);
      window[cb] = d => { clearTimeout(t); resolve(d); cleanup(); };
      s.onerror  = () => { clearTimeout(t); reject(new Error('Gagal memuat data')); cleanup(); };
      function cleanup() { delete window[cb]; if (s.parentNode) s.remove(); }
      s.src = GAS_URL + '?' + params + '&callback=' + cb;
      document.head.appendChild(s);
    });
  }

  function goTo(page, id) {
    if (page === 'Display') { window.location.href = '/'; return; }
    if (page === 'Artikel') { window.location.href = id ? '/artikel?id='+id : '/artikel'; return; }
    if (page === 'Admin')   { window.open(GAS_URL+'?p=Admin','_blank'); return; }
  }

  // ── SEO Meta helpers ──────────────────────────────────────
  function updateMetaArtikel(a) {
    const url  = window.location.origin + '/artikel?id=' + a.id;
    const desc = (a.konten||'').replace(/<[^>]+>/g,'').substring(0,160);
    document.title = a.judul + ' — RekomendasiPilihan';
    const canon = document.getElementById('meta-canonical');
    if (canon) canon.href = url;
    setMetaId('meta-og-type','article');
    setMetaId('meta-og-title', a.judul + ' — RekomendasiPilihan');
    setMetaId('meta-og-desc', desc);
    setMetaId('meta-og-url', url);
    setMetaId('meta-og-image', a.foto||'');
    setMetaProp('article:published_time', a.tanggal||'');
    setMetaProp('article:section', a.kategori||'Artikel');
    setMetaId('meta-tw-title', a.judul);
    setMetaId('meta-tw-desc', desc);
    setMetaId('meta-tw-image', a.foto||'');
    const schema = document.getElementById('schema-main');
    if (schema) schema.textContent = JSON.stringify({
      "@context":"https://schema.org","@type":"Article",
      "headline":a.judul,"description":desc,"image":a.foto,
      "datePublished":a.tanggal,"dateModified":a.tanggal,
      "author":{"@type":"Person","name":"RekomendasiPilihan Editor"},
      "publisher":{"@type":"Organization","name":"RekomendasiPilihan","url":"https://www.rekomendasipilihan.my.id/"},
      "mainEntityOfPage":{"@type":"WebPage","@id":url},
      "inLanguage":"id-ID","articleSection":a.kategori||'Review'
    });
  }
  function setMetaId(id,val){const el=document.getElementById(id);if(el)el.content=val;}
  function setMetaProp(prop,val){
    let el=document.querySelector('meta[property="'+prop+'"]');
    if(!el){el=document.createElement('meta');el.setAttribute('property',prop);document.head.appendChild(el);}
    el.content=val;
  }
  function setMeta(name,val){
    let el=document.querySelector('meta[name="'+name+'"]');
    if(!el){el=document.createElement('meta');el.name=name;document.head.appendChild(el);}
    el.content=val;
  }

  function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}
  function fmtH(h){const n=parseInt((h||'').toString().replace(/[^\d]/g,''))||0;return n>0?'Rp '+n.toLocaleString('id-ID'):'';}
  window.addEventListener('scroll',()=>{document.getElementById('btt').classList.toggle('vis',window.scrollY>400);});

  // ── RENDER DETAIL ─────────────────────────────────────────
  function renderDetail(data) {
    if (!data) {
      document.getElementById('main-col').innerHTML =
        `<div class="nf"><h2>404 — Artikel Tidak Ditemukan</h2>
         <p><a onclick="goTo('Artikel')" style="color:#1a3a7c;cursor:pointer;">← Kembali ke daftar artikel</a></p></div>`;
      return;
    }
    const { artikel, ads } = data;
    updateMetaArtikel(artikel);
    const articleUrl = window.location.origin + '/artikel?id=' + artikel.id;
    const waText = encodeURIComponent('📰 ' + artikel.judul + ' — baca di sini: ' + articleUrl);

    document.getElementById('main-col').innerHTML = `
      <div class="breadcrumb">
        <a onclick="goTo('Display')">Katalog</a> ›
        <a onclick="goTo('Artikel')">Artikel</a> › ${esc(artikel.kategori||'Review')}
      </div>
      <article class="article-card" itemscope itemtype="https://schema.org/Article">
        <img class="hero-img" src="${artikel.foto}" alt="${esc(artikel.judul)}" itemprop="image"
             loading="eager" decoding="async"
             onerror="this.style.display='none'">
        <div class="art-body">
          <div class="meta-row">
            <span class="cat-chip">${esc(artikel.kategori||'Artikel')}</span>
            <span class="date-chip">📅 <time itemprop="datePublished">${artikel.tanggal}</time></span>
          </div>
          <h1 itemprop="headline">${artikel.judul}</h1>
          <div class="prose" itemprop="articleBody">${sisipAds(artikel.konten, ads)}</div>
          <div class="share-bar">
            <a class="btn-share" href="https://wa.me/?text=${waText}" target="_blank" rel="noopener">
              📲 Share WhatsApp
            </a>
            <button class="btn-copy" onclick="copyArtikelLink('${articleUrl}')">🔗 Copy Link</button>
          </div>
          ${buildRelated(ads)}
          <div id="related-articles-${artikel.id}"></div>
        </div>
      </article>`;

    if (typeof allArtCache !== 'undefined' && allArtCache.length) {
      renderRelatedArticles(artikel.id, artikel.kategori, allArtCache);
    }
  }

  function copyArtikelLink(url) {
    navigator.clipboard.writeText(url).then(()=>alert('Link artikel disalin!')).catch(()=>{});
  }

  function buildRelated(ads) {
    if (!ads||!ads.length) return '';
    return `<div class="related-section">
      <h3>🛍️ Produk Rekomendasi di Artikel Ini</h3>
      <div class="related-grid">
        ${ads.slice(0,4).map(p=>`
          <div class="related-card" onclick="window.open('${p.link}','_blank')">
            <img src="${p.foto}" alt="${esc(p.judul)}" loading="lazy" onerror="this.src='https://via.placeholder.com/180x180?text=No'">
            <div class="related-card-body">
              <p>${p.judul}</p>
              <span>${fmtH(p.harga)||'Cek harga →'}</span>
            </div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  function sisipAds(konten, ads) {
    if (!ads||!ads.length) return konten;
    const blk  = buildAdBlock(ads);
    const part = konten.split('</p>');
    const idx  = Math.min(3, Math.floor(part.length/2));
    if (part.length > 2) part.splice(idx,0,blk); else part.push(blk);
    return part.join('</p>');
  }

  function buildAdBlock(ads) {
    return `<div class="inline-ad">
      <div class="ad-lbl">🛍️ Produk Rekomendasi Terkait</div>
      <div class="ad-grid">${ads.map(p=>`
        <div class="ad-card" itemscope itemtype="https://schema.org/Product" onclick="window.open('${p.link}','_blank')">
          <img src="${p.foto}" alt="${esc(p.judul)}" loading="lazy" onerror="this.src='https://via.placeholder.com/150x150?text=No'">
          <div class="ad-info">
            <span class="ad-kat">${esc(p.kategori||'Produk')}</span>
            <p itemprop="name">${p.judul}</p>
            ${fmtH(p.harga)?'<span class="harga">'+fmtH(p.harga)+'</span>':''}
            <a href="${p.link}" target="_blank" rel="noopener sponsored">Cek Harga →</a>
          </div>
        </div>`).join('')}
      </div></div>`;
  }

  function renderRelatedArticles(currentId, kategori, list) {
    const el = document.getElementById('related-articles-'+currentId);
    if (!el) return;
    const sameCat = list.filter(a=>a.id!==currentId&&a.kategori===kategori).slice(0,3);
    const others  = list.filter(a=>a.id!==currentId&&a.kategori!==kategori).slice(0,3-sameCat.length);
    const related = [...sameCat,...others].slice(0,4);
    if (!related.length) return;
    el.innerHTML = `<div class="bottom-section">
      <h3>📰 Artikel Lainnya yang Mungkin Kamu Suka</h3>
      <div class="related-art-grid">
        ${related.map(a=>`
          <div class="related-art-card" onclick="goTo('Artikel','${a.id}')">
            <img src="${a.foto}" alt="${esc(a.judul)}" loading="lazy" onerror="this.src='https://via.placeholder.com/170x88?text=No'">
            <div class="related-art-card-body">
              <span class="kat-lbl">${esc(a.kategori||'Artikel')}</span>
              <p>${a.judul}</p>
            </div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  // ── RENDER SIDEBAR ────────────────────────────────────────
  function renderSidebar(ads, artList) {
    const produkHTML = ads&&ads.length
      ? ads.slice(0,4).map(p=>`
          <div class="sb-prod">
            <img src="${p.foto}" alt="${esc(p.judul)}" onerror="this.style.opacity='.3'">
            <div class="sb-prod-info">
              <p>${p.judul}</p>
              <a href="${p.link}" target="_blank" rel="noopener sponsored">Cek →</a>
            </div>
          </div>`).join('')
      : '<p style="color:#6b7280;font-size:.8rem;">Belum ada produk.</p>';

    const artHTML = artList&&artList.length
      ? artList.filter(a=>a.id!==ARTIKEL_ID).slice(0,5).map(a=>`
          <div class="sb-art" onclick="goTo('Artikel','${a.id}')">
            <img src="${a.foto}" alt="${esc(a.judul)}" onerror="this.style.opacity='.3'">
            <div><p>${a.judul}</p><span>${a.kategori||''} · ${a.tanggal||''}</span></div>
          </div>`).join('')
      : '<p style="color:#6b7280;font-size:.8rem;">Belum ada artikel lain.</p>';

    document.getElementById('sidebar-col').innerHTML = `
      <div class="sb-card"><h4>🔥 Produk Pilihan</h4>${produkHTML}</div>
      <div class="sb-card"><h4>📰 Artikel Lainnya</h4>${artHTML}</div>`;
  }

  // ── RENDER LIST ───────────────────────────────────────────
  let allArt = [], artKat = '', allArtCache = [];

  function renderList(list) {
    const el  = document.getElementById('art-list'); if (!el) return;
    const inp = document.getElementById('art-search-input');
    const q   = inp ? inp.value.toLowerCase() : '';
    let filtered = artKat ? list.filter(a=>a.kategori===artKat) : list;
    if (q) filtered = filtered.filter(a=>(a.judul||'').toLowerCase().includes(q)||(a.kategori||'').toLowerCase().includes(q));
    el.innerHTML = filtered.length ? filtered.map(a=>`
      <div class="art-card" onclick="goTo('Artikel','${a.id}')">
        <img class="art-thumb" src="${a.foto}" alt="${esc(a.judul)}" loading="lazy" onerror="this.style.opacity='.3'">
        <div class="art-info">
          <span class="art-kat">${esc(a.kategori||'Artikel')}</span>
          <h3>${a.judul}</h3>
          <p>${a.preview}</p>
          <span class="art-date">📅 ${a.tanggal}</span>
        </div>
      </div>`).join('')
    : `<div class="empty-art"><div>🔍</div><p>Tidak ada artikel yang cocok.</p></div>`;
  }

  function buildChips(list) {
    const chips  = document.getElementById('art-chips'); if (!chips) return;
    const katSet = new Set(list.map(a=>a.kategori).filter(Boolean));
    katSet.forEach(k => {
      const b = document.createElement('button');
      b.className='chip'; b.dataset.kat=k; b.textContent=k; chips.appendChild(b);
    });
    chips.addEventListener('click', e => {
      const btn = e.target.closest('.chip'); if (!btn) return;
      document.querySelectorAll('.chip').forEach(c=>c.classList.remove('act'));
      btn.classList.add('act'); artKat=btn.dataset.kat; renderList(allArt);
    });
  }

  // ── INIT ─────────────────────────────────────────────────
  (function init() {
    if (ARTIKEL_ID) {
      fetchGAS('action=artikel_detail&id=' + ARTIKEL_ID)
        .then(data => {
          renderDetail(data);
          fetchGAS('action=artikel_list')
            .then(list => {
              allArtCache = list;
              renderSidebar(data&&data.ads, list);
              if (data&&data.artikel) renderRelatedArticles(ARTIKEL_ID, data.artikel.kategori, list);
            })
            .catch(() => {
              document.getElementById('sidebar-col').innerHTML =
                '<div class="sb-card"><p style="color:#6b7280;font-size:.8rem;">Gagal memuat sidebar.</p></div>';
            });
        })
        .catch(e => {
          document.getElementById('main-col').innerHTML =
            `<div class="nf"><h2>⚠️ Gagal Memuat</h2><p>${e.message}</p>
             <p style="margin-top:12px;"><a onclick="goTo('Artikel')" style="color:#1a3a7c;cursor:pointer;">← Kembali ke Artikel</a></p></div>`;
        });
    } else {
      document.getElementById('sidebar-col').innerHTML = '';
      document.getElementById('main-col').innerHTML = `
        <div class="breadcrumb">
          <a onclick="goTo('Display')" style="cursor:pointer;">Katalog</a> › Artikel
        </div>
        <div class="list-header">📰 Semua Artikel</div>
        <div class="list-sub">Review jujur dan panduan belanja dari pengalaman nyata</div>
        <div class="list-search">
          <input type="text" id="art-search-input" placeholder="🔍 Cari artikel..." oninput="renderList(allArt)">
        </div>
        <div class="list-chips" id="art-chips">
          <button class="chip act" data-kat="">Semua</button>
        </div>
        <div id="art-list">
          <div class="skel" style="height:88px;margin-bottom:12px;"></div>
          <div class="skel" style="height:88px;margin-bottom:12px;"></div>
          <div class="skel" style="height:88px;margin-bottom:12px;"></div>
        </div>`;
      fetchGAS('action=artikel_list')
        .then(list => { allArt=list; buildChips(list); renderList(list); })
        .catch(e => {
          const el = document.getElementById('art-list');
          if (el) el.innerHTML = `<div class="empty-art"><div>⚠️</div><p>Gagal memuat: ${e.message}</p></div>`;
        });
    }
  })();
</script>
</body>
</html>
